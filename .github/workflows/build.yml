name: Build APK (Naughty Bear ReStuff Android)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host toolchain (cmake, ninja, clang 19)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl git \
            libx11-xcb-dev libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev
          # clang 19 é OBRIGATÓRIO com as headers libstdc++ 14 do ubuntu-24.04:
          # <expected> é gated por __cpp_concepts >= 202002L e o clang <=18
          # define 201907L (P2113 só pousou no clang 19) → std::expected vazio.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang++-19" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages (platform, build-tools, NDK)
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Apply port overlays
        run: bash scripts/apply_overlays.sh

      - name: Host codegen (rexglue CLI + Default.xex)
        run: bash scripts/build_host_codegen.sh

      - name: Native Android build (librestuff.so)
        run: bash scripts/build_android_native.sh

      - name: Build APK (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/NaughtyBear-ReStuff-arm64-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/NaughtyBear-ReStuff-arm64-debug.apk
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: naughtybear-restuff-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload build logs em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/host-codegen/CMakeCache.txt
            build/android/arm64-v8a/CMakeCache.txt
          if-no-files-found: ignore
