name: Build APK (Naughty Bear ReStuff Android)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host toolchain (cmake, ninja, clang 19)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build curl git \
            libx11-xcb-dev libx11-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev
          # clang 19 é OBRIGATÓRIO com as headers libstdc++ 14 do ubuntu-24.04:
          # <expected> é gated por __cpp_concepts >= 202002L e o clang <=18
          # define 201907L (P2113 só pousou no clang 19) → std::expected vazio.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 19
          echo "CC=clang-19" >> "$GITHUB_ENV"
          echo "CXX=clang++-19" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages (platform, build-tools, NDK)
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Apply port overlays
        run: bash scripts/apply_overlays.sh

      # Testes de unidade Kotlin (avaliação 17-e2): o fix do ENOENT do
      # Vortek (diretório files/drivers nunca criado no fluxo embutido) e o
      # self-heal do reconcile têm cobertura em JVM puro, sem Robolectric —
      # falha em segundos, ANTES do build nativo de ~45min. Também compila
      # todo o Kotlin do app, pegando erro de compilação cedo.
      - name: Kotlin unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Host codegen (rexglue CLI + Default.xex)
        run: bash scripts/build_host_codegen.sh

      # Round-trip do protocolo Vortek (avaliação 16-e2): serializa no TU
      # cliente e unserializa no TU servidor — pega a classe de bug "mudou
      # só um lado do par serializador" (os bugs 16-e1) em segundos, ANTES
      # do build Android de ~45min.
      - name: Vortek protocol round-trip test (host)
        run: |
          set -e
          V=native/thirdparty/vortek
          R=native/thirdparty/vortekrenderer
          mkdir -p build/rt
          gcc -c -O1 -Wall -DVK_USE_PLATFORM_ANDROID_KHR -I"$V/include" \
            "$V/tests/roundtrip_client.c" -o build/rt/client.o
          gcc -c -O1 -Wall -DVK_USE_PLATFORM_ANDROID_KHR -DVT_SERVER=1 -D_GNU_SOURCE \
            -I"$R/include" -I"$R/winlator/include" -I"$V/tests/hoststub" \
            "$V/tests/roundtrip_server.c" -o build/rt/server.o
          gcc -c -O1 -Wall -I"$V/tests" "$V/tests/roundtrip_main.c" -o build/rt/main.o
          gcc -c -O1 -DVK_USE_PLATFORM_ANDROID_KHR -I"$V/include" "$V/src/vk_object.c" -o build/rt/vk_object.o
          gcc -c -O1 -I"$V/include" "$V/src/arrays.c" -o build/rt/arrays.o
          gcc -O1 build/rt/client.o build/rt/server.o build/rt/main.o \
            build/rt/vk_object.o build/rt/arrays.o -lpthread -o build/rt/roundtrip
          ./build/rt/roundtrip

      - name: Native Android build (librestuff.so)
        run: bash scripts/build_android_native.sh

      - name: Build APK (Gradle)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug

      - name: Verify APK native libs (fail-fast se libc++_shared faltar)
        run: |
          python3 - <<'EOF'
          import zipfile, glob, sys
          apk = glob.glob("app/build/outputs/apk/release/*.apk")[0]
          print(f"Verificando: {apk}")
          z = zipfile.ZipFile(apk)
          libs = sorted(n for n in z.namelist()
                        if n.startswith("lib/arm64-v8a/") and n.endswith(".so"))
          print("Libs nativas empacotadas:")
          for l in libs:
              print(f"  {l}")
          required = {
              "lib/arm64-v8a/librestuff.so",
              "lib/arm64-v8a/librexruntime.so",
              "lib/arm64-v8a/libc++_shared.so",
              # AdrenoTools (driver Turnip custom): hooks precisam estar no
              # APK (useLegacyPackaging=true extrai p/ nativeLibraryDir).
              "lib/arm64-v8a/libadrenotools.so",
              "lib/arm64-v8a/libmain_hook.so",
              "lib/arm64-v8a/libhook_impl.so",
              "lib/arm64-v8a/libfile_redirect_hook.so",
              "lib/arm64-v8a/libgsl_alloc_hook.so",
              # Vortek (camada de compatibilidade Vulkan, brunodev85/Winlator):
              # cliente (dlopen direto pelo motor) + servidor (hospedado pelo
              # android_main.cpp no mesmo processo).
              "lib/arm64-v8a/libvulkan_vortek.so",
              "lib/arm64-v8a/libvortekrenderer.so",
          }
          missing = required - set(libs)
          if missing:
              sys.exit(f"ERRO FATAL: libs ausentes do APK: {sorted(missing)}")
          print("OK: todas as libs nativas obrigatórias estão no APK")
          EOF

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/NaughtyBear-ReStuff-arm64-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/NaughtyBear-ReStuff-arm64-debug.apk
          ls -la dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: naughtybear-restuff-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload debug symbols (librestuff.so.unstripped)
        # ARM PERF/diagnóstico: line tables do build (-gline-tables-only).
        # O APK recebe a lib stripada (lean); ESTE artefato resolve backtraces
        # "module+0xOFFSET" offline: llvm-symbolizer --obj=librestuff.so.unstripped 0xOFFSET
        uses: actions/upload-artifact@v4
        with:
          name: naughtybear-restuff-debug-symbols
          path: build/android/*/librestuff.so.unstripped
          if-no-files-found: warn

      - name: Upload build logs em falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/host-codegen/CMakeCache.txt
            build/android/arm64-v8a/CMakeCache.txt
          if-no-files-found: ignore
